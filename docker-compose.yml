services:
  vehicle-scheduling-api:
    build: .
    image: bus-ev-vehicle-scheduling:1.0.0
    container_name: bus-ev-vehicle-scheduling
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
